<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emberdeep · 余烬深渊</title>
  </head>
  <body>
    <main id="app">
      <h1>EMBERDEEP <span class="subtitle">余烬深渊</span></h1>
      <div id="stage">
        <canvas id="game"></canvas>
        <div id="overlay" hidden></div>
      </div>
      <div id="status"></div>
      <canvas id="minimap"></canvas>
      <div id="log"></div>
      <div id="touch-actions">
        <button data-act="pickup" type="button">捡</button>
        <button data-act="quaff" type="button">喝</button>
        <button data-act="teleport" type="button">传</button>
        <button data-act="fireblast" type="button">焰</button>
        <button data-act="descend" type="button">下</button>
        <button data-act="inventory" type="button">包</button>
        <button data-act="toggleMute" type="button">音</button>
        <button data-act="restart" type="button">重</button>
      </div>
      <p class="help">移动 方向键/WASD/hjkl · 斜向 yubn · 等待 空格 · 捡拾 g · 喝药 q · 射击 z · 自动探索 o · 背包 i · 消息 ? · 传送 t · 烈焰 f · 下楼 &gt; · 静音 m · 重开 r</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
